name: Link Checker

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'knowledge/**/*.html'
      - 'knowledge/**/*.md'
      - 'profile/**/*.html'
      - 'endowed/**/*.html'
      - 'scripts/check_links.py'
      - 'scripts/fix_broken_links.py'
      - 'scripts/update_index_stats.py'
      - 'scripts/build_search_index.py'
      - 'scripts/build_sitemap.py'
      - 'scripts/test_*.py'
      - 'scripts/check_translation_residue.py'
      - 'scripts/check_stale_coming_soon.py'
      - 'tools/validate_mermaid.py'
      - '.github/workflows/link-check.yml'
  pull_request:
    paths:
      - 'knowledge/**/*.html'
      - 'knowledge/**/*.md'
      - 'profile/**/*.html'
      - 'endowed/**/*.html'
      - 'scripts/check_links.py'
      - 'scripts/fix_broken_links.py'
      - 'scripts/update_index_stats.py'
      - 'scripts/build_search_index.py'
      - 'scripts/build_sitemap.py'
      - 'scripts/test_*.py'
      - 'scripts/check_translation_residue.py'
      - 'scripts/check_stale_coming_soon.py'
      - 'tools/validate_mermaid.py'
      - '.github/workflows/link-check.yml'
  workflow_dispatch:

jobs:
  check-generated-assets:
    name: Check Generated Assets (stats, search index, sitemap)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # fetch-depth is intentionally left at the default (1, shallow):
        # build_sitemap.py --check auto-detects a shallow clone and degrades
        # to a URL-set-only comparison (skipping <lastmod>) in that case, so
        # a full-history checkout isn't needed just for this check.

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No pip cache here: this job is stdlib-only and never runs
          # pip install, so cache: 'pip' makes the post-step fail on
          # the missing ~/.cache/pip directory (newer runner images).

      - name: Verify dojo/landing page stats are up to date
        run: python3 scripts/update_index_stats.py --check

      - name: Verify search index is up to date
        run: python3 scripts/build_search_index.py --check

      - name: Verify sitemap.xml is up to date
        run: python3 scripts/build_sitemap.py --check

      - name: Check for Japanese machine-translation residue (EN pages)
        # stdlib-only; fails on 。 or excess kana in EN body text (N-02 fix)
        run: python3 scripts/check_translation_residue.py --check

      - name: Check for stale coming-soon chapter navs
        # stdlib-only; fails when a 準備中 nav points at an existing chapter (N-03 fix)
        run: python3 scripts/check_stale_coming_soon.py --check

  check-links-en:
    name: Check Links (English)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml tqdm

      - name: Run link checker (English)
        id: linkcheck-en
        run: |
          python scripts/check_links.py \
            --path knowledge/en \
            --output linkcheck_en_report.txt
        continue-on-error: true

      - name: Upload English report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkcheck-en-report
          path: linkcheck_en_report.txt
          retention-days: 30

      - name: Display English report summary
        if: always()
        run: |
          echo "=== Link Check Summary (English) ==="
          if [ -f linkcheck_en_report.txt ]; then
            head -n 50 linkcheck_en_report.txt
            echo ""
            echo "Full report available in artifacts"
          else
            echo "Report file not found"
          fi

      - name: Check for broken links (English)
        run: |
          if grep -q "Broken links: 0" linkcheck_en_report.txt && \
             grep -q "Missing anchors: 0" linkcheck_en_report.txt; then
            echo "No broken links found in English version"
            exit 0
          else
            echo "Broken links detected in English version"
            echo "Download the artifact for detailed report"
            exit 1
          fi

  check-links-jp:
    name: Check Links (Japanese)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml tqdm

      - name: Run link checker (Japanese)
        id: linkcheck-jp
        run: |
          python scripts/check_links.py \
            --path knowledge/jp \
            --output linkcheck_jp_report.txt
        continue-on-error: true

      - name: Upload Japanese report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkcheck-jp-report
          path: linkcheck_jp_report.txt
          retention-days: 30

      - name: Display Japanese report summary
        if: always()
        run: |
          echo "=== Link Check Summary (Japanese) ==="
          if [ -f linkcheck_jp_report.txt ]; then
            head -n 50 linkcheck_jp_report.txt
            echo ""
            echo "Full report available in artifacts"
          else
            echo "Report file not found"
          fi

      - name: Check for broken links (Japanese)
        run: |
          if grep -q "Broken links: 0" linkcheck_jp_report.txt && \
             grep -q "Missing anchors: 0" linkcheck_jp_report.txt; then
            echo "No broken links found in Japanese version"
            exit 0
          else
            echo "Broken links detected in Japanese version"
            echo "Download the artifact for detailed report"
            exit 1
          fi

  unit-tests:
    name: Unit Tests (scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run unit tests
        # Discovery picks up every scripts/test_*.py (current and future).
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Validate Mermaid diagrams
        # stdlib-only validator; exits 1 on any syntax error (F-01 fix)
        run: |
          python3 tools/validate_mermaid.py knowledge/jp
          python3 tools/validate_mermaid.py knowledge/en

  summary:
    name: Link Check Summary
    runs-on: ubuntu-latest
    needs: [check-generated-assets, check-links-en, check-links-jp, unit-tests]
    if: always()

    steps:
      - name: Check overall status
        run: |
          echo "=== Link Check Complete ==="
          echo "Generated assets: ${{ needs.check-generated-assets.result }}"
          echo "English: ${{ needs.check-links-en.result }}"
          echo "Japanese: ${{ needs.check-links-jp.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"

          if [ "${{ needs.check-generated-assets.result }}" != "success" ] || \
             [ "${{ needs.check-links-en.result }}" != "success" ] || \
             [ "${{ needs.check-links-jp.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo ""
            echo "Some link checks failed. Please review the artifacts."
            exit 1
          else
            echo ""
            echo "All link checks passed successfully"
            exit 0
          fi
