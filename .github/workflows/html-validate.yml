name: HTML Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'knowledge/**/*.html'
      - 'endowed/**/*.html'
      - 'profile/**/*.html'
      - '.github/workflows/html-validate.yml'
  pull_request:
    paths:
      - 'knowledge/**/*.html'
      - 'endowed/**/*.html'
      - 'profile/**/*.html'
      - '.github/workflows/html-validate.yml'
  workflow_dispatch:

# Pinned html-validate version (audit F-06). html-validate:recommended added the
# "unique-landmark" rule in 8.9.0, which flags 80+ pre-existing landmarks across the
# corpus; 8.8.0 is the newest release that validates the entire tracked corpus clean
# under the relaxed config below. To upgrade: bump HTML_VALIDATE_VERSION, run the
# batched validation locally, and resolve/triage any newly reported rules first.
env:
  HTML_VALIDATE_VERSION: '8.8.0'

jobs:
  validate-html-en:
    name: Validate HTML (English)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g "html-validate@${HTML_VALIDATE_VERSION}"

      - name: Create html-validate configuration
        run: |
          cat > .htmlvalidate.json << 'EOF'
          {
            "extends": ["html-validate:recommended"],
            "rules": {
              "void-style": "off",
              "no-trailing-whitespace": "off",
              "attr-quotes": ["error", { "style": "double", "unquoted": false }],
              "no-inline-style": "off",
              "require-sri": "off",
              "no-utf8-bom": "error",
              "doctype-html": "error",
              "element-required-attributes": "error",
              "no-missing-references": "warn",
              "no-raw-characters": "off",
              "long-title": "off",
              "attribute-boolean-style": "off",
              "prefer-tbody": "off",
              "wcag/h63": "off",
              "element-name": "off",
              "parser-error": "off",
              "attr-spacing": "off",
              "close-order": "off",
              "valid-id": "off",
              "element-permitted-content": "off",
              "element-permitted-parent": "off",
              "no-redundant-role": "off",
              "no-implicit-close": "off"
            },
            "elements": [
              "html5"
            ]
          }
          EOF

      - name: Find HTML files (English)
        id: find-html-en
        run: |
          echo "Finding all tracked HTML files under knowledge/en (excluding /archive/)..."
          git ls-files 'knowledge/en/*.html' | grep -v '/archive/' > html_files_en.txt || true
          FILE_COUNT=$(wc -l < html_files_en.txt)
          echo "Found $FILE_COUNT HTML files"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Validate HTML files (English)
        id: validate-en
        run: |
          echo "=== HTML Validation (English) — full corpus ==="

          if [ ! -s html_files_en.txt ]; then
            echo "No HTML files to validate"
            exit 0
          fi

          echo "Validating ${{ steps.find-html-en.outputs.file_count }} files in batches of 150..."
          # xargs exits non-zero if ANY batch (html-validate invocation) fails; pipefail
          # makes that failure propagate through the tee so the step (and job) fails.
          set -o pipefail
          cat html_files_en.txt | xargs -n 150 html-validate -c .htmlvalidate.json 2>&1 | tee html_validation_en_output.txt

      - name: Create validation report (English)
        if: always()
        run: |
          {
            echo "HTML Validation Report (English) — full corpus"
            echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "html-validate: $(html-validate --version 2>/dev/null || echo "${HTML_VALIDATE_VERSION}")"
            echo "=================================="
            echo ""
            echo "HTML files validated: ${{ steps.find-html-en.outputs.file_count }}"
            echo ""
            echo "Validation output:"
            cat html_validation_en_output.txt 2>/dev/null || echo "(no output captured)"
          } > html_validation_en_report.txt

      - name: Upload English validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-validation-en-report
          path: html_validation_en_report.txt
          retention-days: 30

  validate-html-jp:
