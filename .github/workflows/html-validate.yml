  validate-html-other:
    name: Validate HTML (Endowed & Private)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g "html-validate@${HTML_VALIDATE_VERSION}"

      - name: Create html-validate configuration
        run: |
          cat > .htmlvalidate.json << 'EOF'
          {
            "extends": ["html-validate:recommended"],
            "rules": {
              "void-style": "off",
              "no-trailing-whitespace": "off",
              "attr-quotes": ["error", { "style": "double", "unquoted": false }],
              "no-inline-style": "off",
              "require-sri": "off",
              "no-utf8-bom": "error",
              "doctype-html": "error",
              "element-required-attributes": "error",
              "no-missing-references": "warn",
              "no-raw-characters": "off",
              "long-title": "off",
              "attribute-boolean-style": "off",
              "prefer-tbody": "off",
              "wcag/h63": "off",
              "element-name": "off",
              "parser-error": "off",
              "attr-spacing": "off",
              "close-order": "off",
              "valid-id": "off",
              "element-permitted-content": "off",
              "element-permitted-parent": "off",
              "no-redundant-role": "off",
              "no-implicit-close": "off"
            },
            "elements": [
              "html5"
            ]
          }
          EOF

      - name: Find HTML files (Endowed & Private)
        id: find-html-other
        run: |
          echo "Finding remaining tracked HTML (outside knowledge/, excluding /archive/)..."
          git ls-files '*.html' | grep -v '^knowledge/' | grep -v '/archive/' > html_files_other.txt || true
          FILE_COUNT=$(wc -l < html_files_other.txt)
          echo "Found $FILE_COUNT HTML files"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Validate HTML files (Endowed & Private)
        id: validate-other
        run: |
          echo "=== HTML Validation (Endowed & Private) — full corpus ==="

          if [ ! -s html_files_other.txt ]; then
            echo "No HTML files to validate"
            exit 0
          fi

          echo "Validating ${{ steps.find-html-other.outputs.file_count }} files in batches of 150..."
          # xargs exits non-zero if ANY batch (html-validate invocation) fails; pipefail
          # makes that failure propagate through the tee so the step (and job) fails.
          set -o pipefail
          cat html_files_other.txt | xargs -n 150 html-validate -c .htmlvalidate.json 2>&1 | tee html_validation_other_output.txt

      - name: Create validation report (Endowed & Private)
        if: always()
        run: |
          {
            echo "HTML Validation Report (Endowed & Private) — full corpus"
            echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "html-validate: $(html-validate --version 2>/dev/null || echo "${HTML_VALIDATE_VERSION}")"
            echo "=================================="
            echo ""
            echo "HTML files validated: ${{ steps.find-html-other.outputs.file_count }}"
            echo ""
            echo "Validation output:"
            cat html_validation_other_output.txt 2>/dev/null || echo "(no output captured)"
          } > html_validation_other_report.txt

      - name: Upload Endowed & Private validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-validation-other-report
          path: html_validation_other_report.txt
          retention-days: 30

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-html-en, validate-html-jp, validate-html-other]
    if: always()

    steps:
      - name: Check overall status
        run: |
          echo "=== HTML Validation Complete (full corpus) ==="
          echo "English (knowledge/en):        ${{ needs.validate-html-en.result }}"
          echo "Japanese (knowledge/jp):       ${{ needs.validate-html-jp.result }}"
          echo "Endowed & Private:             ${{ needs.validate-html-other.result }}"

          if [ "${{ needs.validate-html-en.result }}" != "success" ] || \
             [ "${{ needs.validate-html-jp.result }}" != "success" ] || \
             [ "${{ needs.validate-html-other.result }}" != "success" ]; then
            echo ""
            echo "Some validations failed. Please review the artifacts and logs."
            exit 1
          else
            echo ""
            echo "All HTML validations passed successfully (entire corpus)"
            exit 0
          fi
