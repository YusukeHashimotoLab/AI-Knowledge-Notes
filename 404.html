<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>404 - Page Not Found | AI Terakoya</title>

    <script>
        // Apply saved theme before paint to avoid flash
        (function () {
            try {
                var t = localStorage.getItem('terakoya-theme');
                if (t === 'dark' || t === 'light') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* storage unavailable */ }
        })();
    </script>

    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --text: #1f2933;
            --text-muted: #52606d;
            --border: #e4e7eb;
            --shadow: rgba(15, 23, 42, 0.08);
            --accent: #5b52e0;
            --accent-hover: #473fc4;
        }
        :root[data-theme="dark"] {
            --bg: #0e1116;
            --surface: #171b22;
            --text: #e6e9ee;
            --text-muted: #9aa5b1;
            --border: #2b323c;
            --shadow: rgba(0, 0, 0, 0.4);
            --accent: #8b83ff;
            --accent-hover: #a49dff;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e1116;
                --surface: #171b22;
                --text: #e6e9ee;
                --text-muted: #9aa5b1;
                --border: #2b323c;
                --shadow: rgba(0, 0, 0, 0.4);
                --accent: #8b83ff;
                --accent-hover: #a49dff;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow);
            max-width: 34rem;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .code { font-size: 3.2rem; font-weight: 700; color: var(--accent); margin-bottom: 0.4rem; }
        h1 { font-size: 1.3rem; margin-bottom: 0.4rem; }
        p { color: var(--text-muted); line-height: 1.7; margin-bottom: 0.3rem; }
        .links { margin-top: 1.6rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .links a {
            display: block;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .links a:hover, .links a:focus-visible { color: var(--accent-hover); border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>Page Not Found <span lang="ja">/ ページが見つかりません</span></h1>
        <p>The page you are looking for does not exist or may have been moved.</p>
        <p lang="ja">お探しのページは存在しないか、移動した可能性があります。</p>
        <div class="links">
            <a href="/AI-Knowledge-Notes/knowledge/jp/index.html" lang="ja">🇯🇵 AI寺子屋(日本語)トップへ</a>
            <a href="/AI-Knowledge-Notes/knowledge/en/index.html">🇬🇧 AI Terakoya (English) Home</a>
            <a href="/AI-Knowledge-Notes/">🏠 Site Root / サイトルート</a>
        </div>
    </div>
</body>
</html>
