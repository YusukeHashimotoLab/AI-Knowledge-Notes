<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Search every series and chapter of AI Terakoya by title, headings, and description.">
    <meta name="robots" content="noindex">
    <title>Search - AI Terakoya</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('terakoya-theme');
                if (t === 'dark' || t === 'light') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --bg: #f4f5f7; --surface: #ffffff; --text: #1f2933; --text-muted: #52606d;
            --border: #e4e7eb; --shadow: rgba(15,23,42,0.08);
            --accent: #5b52e0; --accent-hover: #473fc4; --accent-contrast: #ffffff;
            --badge-bg: #e3f2fd; --badge-fg: #1565c0;
            --mark-bg: #fff3bf;
        }
        :root[data-theme="dark"] {
            --bg: #0e1116; --surface: #171b22; --text: #e6e9ee; --text-muted: #9aa5b1;
            --border: #2b323c; --shadow: rgba(0,0,0,0.4);
            --accent: #8b83ff; --accent-hover: #a49dff; --accent-contrast: #10131a;
            --badge-bg: #14304d; --badge-fg: #7fb8ff;
            --mark-bg: #4d3d00;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e1116; --surface: #171b22; --text: #e6e9ee; --text-muted: #9aa5b1;
                --border: #2b323c; --shadow: rgba(0,0,0,0.4);
                --accent: #8b83ff; --accent-hover: #a49dff; --accent-contrast: #10131a;
                --badge-bg: #14304d; --badge-fg: #7fb8ff;
                --mark-bg: #4d3d00;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            line-height: 1.7; color: var(--text); background: var(--bg);
        }
        a { color: var(--accent); }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 1rem; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0.5rem 0 1rem; }
        .home-link { text-decoration: none; font-weight: 700; }
        .locale-link { text-decoration: none; font-weight: 600; color: var(--text-muted); }
        .locale-link:hover { color: var(--accent); }
        h1 { font-size: 1.6rem; margin-bottom: 1rem; }
        .searchbox { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .searchbox input {
            flex: 1; padding: 0.85rem 1.1rem; font-size: 1.05rem;
            border: 2px solid var(--border); border-radius: 10px;
            background: var(--surface); color: var(--text);
        }
        .searchbox input:focus { border-color: var(--accent); outline: none; }
        .searchbox button {
            padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 700; cursor: pointer;
            background: var(--accent); color: var(--accent-contrast);
            border: none; border-radius: 10px;
        }
        .searchbox button:hover { background: var(--accent-hover); }
        .status { color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem; }
        .result {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 1rem 1.25rem; margin-bottom: 0.75rem; box-shadow: 0 1px 4px var(--shadow);
        }
        .result-title { font-size: 1.08rem; font-weight: 700; text-decoration: none; }
        .result-title:hover { text-decoration: underline; }
        .result-meta { margin: 0.25rem 0; font-size: 0.85rem; color: var(--text-muted); }
        .dojo-badge {
            display: inline-block; padding: 0.1rem 0.55rem; border-radius: 999px;
            background: var(--badge-bg); color: var(--badge-fg);
            font-size: 0.78rem; font-weight: 700; margin-right: 0.5rem;
        }
        .result-snippet { font-size: 0.92rem; color: var(--text-muted); }
        mark { background: var(--mark-bg); color: inherit; border-radius: 3px; padding: 0 2px; }
        .hint { color: var(--text-muted); font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <nav class="topbar" aria-label="Navigation">
            <a class="home-link" href="index.html">🏫 AI Terakoya</a>
            <a class="locale-link" href="../jp/search.html" hreflang="ja">🇯🇵 JP</a>
        </nav>
        <main>
            <h1>🔍 Search the Knowledge Base</h1>
            <form class="searchbox" id="form" role="search">
                <input type="search" id="q" placeholder="e.g. Bayesian optimization / Transformer / phase transition" aria-label="Search keywords" autofocus>
                <button type="submit">Search</button>
            </form>
            <p class="status" id="status">Type keywords to search titles, headings, and descriptions (multiple words are ANDed).</p>
            <div id="results" aria-live="polite"></div>
        </main>
    </div>
    <script>
    (function () {
        var DOJO = { FM: 'Math', MI: 'MI', ML: 'ML', MS: 'Materials', PI: 'PI' };
        var index = null;
        var statusEl = document.getElementById('status');
        var resultsEl = document.getElementById('results');
        var input = document.getElementById('q');

        function esc(s) {
            return s.replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }
        function highlight(s, terms) {
            var out = esc(s);
            terms.forEach(function (t) {
                if (!t) return;
                var re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                out = out.replace(re, function (m) { return '<mark>' + m + '</mark>'; });
            });
            return out;
        }
        function search(q) {
            var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
            if (!terms.length) { resultsEl.innerHTML = ''; statusEl.textContent = 'Type keywords to search.'; return; }
            var hits = [];
            for (var i = 0; i < index.length; i++) {
                var r = index[i];
                var t = r.t.toLowerCase(), h = r.h.toLowerCase(), x = r.x.toLowerCase(), s = r.s.toLowerCase();
                var score = 0, ok = true;
                for (var j = 0; j < terms.length; j++) {
                    var term = terms[j], sc = 0;
                    if (t.indexOf(term) >= 0) sc += 3;
                    if (h.indexOf(term) >= 0) sc += 2;
                    if (x.indexOf(term) >= 0) sc += 1;
                    if (s.indexOf(term) >= 0) sc += 1;
                    if (!sc) { ok = false; break; }
                    score += sc;
                }
                if (ok) hits.push([score, r]);
            }
            hits.sort(function (a, b) { return b[0] - a[0]; });
            hits = hits.slice(0, 50);
            statusEl.textContent = hits.length ? hits.length + ' page(s) found (showing top 50)' : 'No matching pages found.';
            resultsEl.innerHTML = hits.map(function (pair) {
                var r = pair[1];
                var snippet = r.x || r.h;
                if (snippet.length > 160) snippet = snippet.slice(0, 160) + '…';
                return '<div class="result">' +
                    '<a class="result-title" href="' + esc(r.u) + '">' + highlight(r.t, terms) + '</a>' +
                    '<p class="result-meta"><span class="dojo-badge">' + esc(DOJO[r.d] || r.d) + '</span>' +
                    esc(r.s ? r.s : 'Dojo top') + '</p>' +
                    (snippet ? '<p class="result-snippet">' + highlight(snippet, terms) + '</p>' : '') +
                    '</div>';
            }).join('');
        }
        function run() {
            var q = input.value.trim();
            var url = new URL(location.href);
            if (q) { url.searchParams.set('q', q); } else { url.searchParams.delete('q'); }
            history.replaceState(null, '', url);
            if (!index) return;
            search(q);
        }
        document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); run(); });
        input.addEventListener('input', function () { if (index) run(); });

        statusEl.textContent = 'Loading search index…';
        fetch('assets/search-index.json')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                index = data;
                var q = new URL(location.href).searchParams.get('q') || '';
                if (q) { input.value = q; search(q); }
                else { statusEl.textContent = index.length + ' pages are searchable. Type keywords to begin.'; }
            })
            .catch(function () { statusEl.textContent = 'Failed to load the search index. Please reload the page.'; });
    })();
    </script>
</body>
</html>
